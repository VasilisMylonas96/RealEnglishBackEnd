# STEP 1 — HTTP-only Nginx config (for certbot to work)
#
# Usage:
#   sudo cp deploy/nginx-step1-http.conf /etc/nginx/sites-available/realenglish
#   sudo ln -sf /etc/nginx/sites-available/realenglish /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot — it will ADD the 443/HTTPS block automatically:
#   sudo certbot --nginx -d realenglishacademy.duckdns.org
#
# After certbot, verify:
#   sudo nginx -t && sudo systemctl reload nginx
#   curl https://realenglishacademy.duckdns.org/api/health

server {
    listen 80;
    listen [::]:80;
    server_name realenglishacademy.duckdns.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Quiz-extractor accepts files up to 1 GB (scanned books).
    client_max_body_size 1024m;

    # Gzip for API JSON responses.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (Socket.io chat + video call signaling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward the real host/protocol so the backend builds correct
        # absolute URLs (PUBLIC_BASE_URL is also set in .env as a safety net).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running requests (quiz extraction, Instagram sync)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
