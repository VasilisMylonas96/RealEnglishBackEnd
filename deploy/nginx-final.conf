# Nginx FINAL config — Real English backend (after Let's Encrypt)
#
# Use this AFTER the certificate has been issued by certbot:
#   sudo cp deploy/nginx-final.conf /etc/nginx/sites-available/realenglish
#   sudo nginx -t && sudo systemctl reload nginx
#
# It contains:
#   - port 80  → 301 redirect to HTTPS
#   - port 443 → proxy to http://127.0.0.1:4000 (with WebSocket headers)
#   - NO direct /uploads/ block — uploads are served by the backend
#     (express.static) via the proxy, because Nginx (www-data) cannot
#     read files under /home/ubuntu.
#
# The certbot include files (options-ssl-nginx.conf, ssl-dhparams.pem)
# are created by certbot on first run.

server {
    listen 80;
    listen [::]:80;
    server_name realenglishacademy.duckdns.org;

    # Let's Encrypt challenge (kept for renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realenglishacademy.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/realenglishacademy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realenglishacademy.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Quiz-extractor accepts files up to 1 GB (scanned books).
    client_max_body_size 1024m;

    # Gzip for API JSON responses.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (Socket.io chat + video call signaling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward the real host/protocol so the backend builds correct
        # absolute URLs (PUBLIC_BASE_URL is also set in .env as a safety net).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running requests (quiz extraction, Instagram sync)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
