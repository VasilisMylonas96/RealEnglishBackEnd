# Nginx config for the Real English backend — FINAL combined config
# (HTTP + HTTPS) for REFERENCE.
#
# ⚠️ Do NOT deploy this file before the Let's Encrypt certificate exists —
# the ssl_certificate paths would be missing and `nginx -t` would fail.
#
# Actual deployment (two steps, see DEPLOY.md):
#   1. sudo cp deploy/nginx-step1-http.conf /etc/nginx/sites-available/realenglish
#      sudo ln -sf /etc/nginx/sites-available/realenglish /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   2. sudo certbot --nginx -d realenglishacademy.duckdns.org
#      (certbot adds the 443 block + HTTP→HTTPS redirect automatically)
#
# IMPORTANT: keep the WebSocket (Upgrade) headers — the backend uses
# Socket.io for chat and video-call signaling.

server {
    listen 80;
    listen [::]:80;
    server_name realenglishacademy.duckdns.org;

    # Let's Encrypt challenge (certbot needs this before the redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # After the certificate is issued, uncomment the redirect:
    # location / {
    #     return 301 https://$host$request_uri;
    # }
}

server {
    # "listen ... http2" works on nginx < 1.25.1 (Ubuntu 24.04 ships 1.24).
    # On nginx >= 1.25.1 use "listen 443 ssl;" + "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realenglishacademy.duckdns.org;

    # certbot fills these in:
    ssl_certificate     /etc/letsencrypt/live/realenglishacademy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realenglishacademy.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Quiz-extractor accepts files up to 1 GB (scanned books).
    client_max_body_size 1024m;

    # Gzip for API JSON responses.
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (Socket.io chat + video call signaling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward the real host/protocol so the backend builds correct
        # absolute URLs (PUBLIC_BASE_URL is also set in .env as a safety net).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running requests (quiz extraction, Instagram sync)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # NOTE: uploads are served by the backend (express.static) via the
    # proxy above — not directly by Nginx. The app runs as the `ubuntu`
    # user which owns the files; Nginx (www-data) cannot read them.
}
